<!DOCTYPE html>
<html lang="en" id="html-root" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <meta name="theme-color" content="#000000" />
  <title>POWER UP BY NULLDASH</title>
  
  <link rel="icon" href="icon.png" type="image/png" sizes="32x32" />
  <link rel="apple-touch-icon" href="apple-icon.png" type="image/png" sizes="180x180" />
  <link rel="stylesheet" href="src/styles.css" />
  
  <style>
    @font-face {
      font-family: 'JetBrains Mono';
      font-style: normal;
      font-weight: 400 800;
      font-display: swap;
      src: url('media/051742360c26797e-s.p.1bkzbscqrt8rl.woff2') format('woff2');
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #050505;
      color: #cacaca;
      font-family: 'JetBrains Mono', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      width: 100vw;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    #app {
      width: 100%;
      max-width: 400px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .main-card {
      background: #0a0a0a;
      border: 1px solid #1f1f1f;
      border-radius: 20px;
      padding: 40px 24px;
      width: 100%;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9), 0 0 20px rgba(229, 9, 20, 0.08);
      text-align: center;
    }

    .brand-logo-img {
      max-width: 210px;
      width: 100%;
      height: auto;
      margin: 0 auto 24px auto;
      display: block;
      object-fit: contain;
      filter: drop-shadow(0 0 12px rgba(229, 9, 20, 0.3));
    }

    .sub-description {
      font-size: 12px;
      color: #777777;
      margin-bottom: 28px;
      letter-spacing: 0.5px;
    }

    .input-label {
      font-size: 12px;
      color: #aaaaaa;
      margin-bottom: 8px;
      display: block;
      font-weight: 600;
      text-align: center;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      background: #000000;
      border: 1.5px solid #2d0d0d;
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 20px;
      transition: border-color 0.2s;
    }

    .input-wrapper:focus-within {
      border-color: #e50914;
    }

    .paste-btn {
      background: #1a1a1a;
      color: #cccccc;
      border: 1px solid #333;
      border-radius: 9px;
      padding: 10px 14px;
      font-size: 11px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
      white-space: nowrap;
    }

    .key-input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-family: inherit;
      font-size: 13px;
      padding: 10px;
      direction: ltr;
      text-align: left;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .key-input::placeholder {
      color: #3b3b3b;
      font-weight: normal;
    }

    .btn-unlock {
      width: 100%;
      background: #cc1111;
      border: none;
      border-radius: 12px;
      padding: 14px;
      color: #ffffff;
      font-family: inherit;
      font-size: 15px;
      font-weight: bold;
      letter-spacing: 1px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      margin-bottom: 20px;
    }

    .footer-text {
      font-size: 11.5px;
      color: #666666;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <div id="app">
    <div class="main-card">
      <img src="logo.png" alt="POWER UP" class="brand-logo-img" />

      <p class="sub-description">No account, no password. Your key only.</p>

      <span class="input-label">Access Key</span>
      <div class="input-wrapper">
        <button type="button" class="paste-btn" id="paste-btn">Paste</button>
        <input 
          type="text" 
          id="access-key-input" 
          class="key-input" 
          placeholder="PWUP-XXXX-XXXX-XXXX" 
          autocomplete="off" 
          spellcheck="false" 
        />
      </div>

      <button type="button" class="btn-unlock" id="unlock-btn">Unlock</button>

      <p class="footer-text">
        No key? Contact your seller.<br>
        <span style="font-size: 10px; color: #444;">Time starts upon connection.</span>
      </p>
    </div>
  </div>

  <script type="module" src="src/app.js"></script>

  <script>
    document.getElementById('paste-btn').addEventListener('click', async () => {
      try {
        const text = await navigator.clipboard.readText();
        if (text) {
          document.getElementById('access-key-input').value = text.trim();
        }
      } catch (err) {
        alert('Please allow clipboard permission');
      }
    });
  </script>
</body>
</html>
