<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POWER UP — Client Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #050505;
      color: #cacaca;
      font-family: 'JetBrains Mono', monospace, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      width: 100%;
      overflow-x: hidden;
    }
    #app {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    /* تصميم شاشة تسجيل الدخول المطابق للصورة تماماً */
    .login-card {
      width: 100%;
      max-width: 360px;
      background: #09090b;
      border: 1px solid #1f1f23;
      border-radius: 28px;
      padding: 32px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
    }
    .logo-img {
      max-width: 210px;
      width: 100%;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 0 20px rgba(229, 9, 20, 0.4));
      margin-bottom: 24px;
    }
    .login-desc {
      font-size: 11.5px;
      color: #71717a;
      line-height: 1.5;
      margin-bottom: 28px;
      letter-spacing: 0.5px;
    }
    .input-group-label {
      width: 100%;
      text-align: left;
      font-size: 11px;
      font-weight: 700;
      color: #a1a1aa;
      letter-spacing: 1.5px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    .input-wrapper {
      width: 100%;
      background: #050505;
      border: 1px solid #27272a;
      border-radius: 16px;
      display: flex;
      align-items: center;
      padding: 6px;
      margin-bottom: 24px;
      transition: border-color 0.2s;
    }
    .input-wrapper:focus-within {
      border-color: #e50914;
    }
    .paste-btn {
      background: #18181b;
      border: none;
      border-radius: 12px;
      color: #d4d4d8;
      font-size: 11px;
      font-weight: 700;
      padding: 10px 16px;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace, sans-serif;
      transition: background 0.2s;
    }
    .paste-btn:hover {
      background: #27272a;
    }
    input#access-key-input {
      flex: 1;
      background: transparent;
      border: none;
      color: #ffffff;
      font-size: 11.5px;
      font-weight: 600;
      text-align: center;
      outline: none;
      font-family: 'JetBrains Mono', monospace, sans-serif;
      letter-spacing: 1.5px;
    }
    input#access-key-input::placeholder {
      color: #52525b;
    }
    button#unlock-btn {
      width: 100%;
      background: #e50914;
      color: #ffffff;
      border: none;
      border-radius: 16px;
      padding: 16px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(229, 9, 20, 0.3);
      transition: opacity 0.2s;
      margin-bottom: 20px;
    }
    button#unlock-btn:active {
      opacity: 0.85;
    }
    .login-footer {
      font-size: 10.5px;
      color: #52525b;
      line-height: 1.6;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <div id="app">
    <!-- واجهة تسجيل الدخول المطابقة للصورة -->
    <div class="login-card">
      <img src="logo.png" alt="POWER UP" class="logo-img" />
      <div class="login-desc">No account, no password. Your key only.</div>
      
      <div class="input-group-label">Access Key</div>
      <div class="input-wrapper">
        <button type="button" id="paste-btn" class="paste-btn">Paste</button>
        <input type="text" id="access-key-input" placeholder="PWUP-XXXX-XXXX-XXXX" maxlength="19" />
      </div>

      <button id="unlock-btn">Unlock</button>
      
      <div class="login-footer">
        No key? Contact your seller.<br>Time starts upon connection.
      </div>
    </div>
  </div>

  <script type="module" src="/src/app.js"></script>
</body>
</html>
