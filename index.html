<!DOCTYPE html>
<html lang="en" id="html-root" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>POWER UP — Client Portal</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #050505;
      color: #cacaca;
      font-family: 'JetBrains Mono', monospace, sans-serif;
      min-height: 100vh;
      width: 100vw;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .top-bar {
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: flex-start;
      z-index: 10;
    }

    #html-root[dir="rtl"] .top-bar { justify-content: flex-end; }

    .lang-btn {
      background: #121212;
      color: #dddddd;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 13px;
      cursor: pointer;
      font-weight: bold;
    }

    #app {
      width: 100%;
      max-width: 380px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .main-card {
      background: #09090b;
      border: 1px solid #1f1f23;
      border-radius: 28px;
      padding: 32px 20px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .brand-logo-img {
      max-width: 190px;
      width: 100%;
      height: auto;
      margin-bottom: 20px;
      object-fit: contain;
      filter: drop-shadow(0 0 20px rgba(229, 9, 20, 0.4));
    }

    .sub-description {
      font-size: 11.5px;
      color: #71717a;
      margin-bottom: 24px;
      letter-spacing: 0.5px;
    }

    .input-label {
      font-size: 11px;
      color: #a1a1aa;
      margin-bottom: 8px;
      display: block;
      font-weight: 700;
      text-align: left;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      width: 100%;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      background: #050505;
      border: 1px solid #27272a;
      border-radius: 16px;
      padding: 6px;
      margin-bottom: 24px;
      width: 100%;
    }

    .input-wrapper:focus-within { border-color: #e50914; }

    .paste-btn {
      background: #18181b;
      color: #d4d4d8;
      border: none;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 11px;
      cursor: pointer;
      font-weight: 700;
      font-family: inherit;
      flex-shrink: 0;
    }

    .key-input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-family: inherit;
      font-size: 11.5px;
      padding: 8px;
      text-align: center;
      font-weight: 600;
      letter-spacing: 1.5px;
    }

    .btn-unlock {
      width: 100%;
      background: #e50914;
      border: none;
      border-radius: 16px;
      padding: 16px;
      color: #ffffff;
      font-family: inherit;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(229, 9, 20, 0.3);
      margin-bottom: 20px;
    }

    .footer-text {
      font-size: 10.5px;
      color: #52525b;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <button type="button" class="lang-btn" id="lang-toggle-btn" onclick="toggleLanguage()">English</button>
  </div>

  <div id="app">
    <div class="main-card">
      <img src="logo.png" alt="POWER UP" class="brand-logo-img" onerror="this.onerror=null; this.style.display='none';" />

      <p class="sub-description" id="text-desc">No account, no password. Your key only.</p>

      <span class="input-label" id="text-label">Access Key</span>
      <div class="input-wrapper">
        <button type="button" class="paste-btn" id="paste-btn">Paste</button>
        <input 
          type="text" 
          id="access-key-input" 
          class="key-input" 
          placeholder="PWUP-XXXX-XXXX-XXXX" 
          autocomplete="off" 
          spellcheck="false" 
          maxlength="19"
        />
      </div>

      <button type="button" class="btn-unlock" id="unlock-btn">Unlock</button>

      <p class="footer-text" id="text-footer">
        No key? Contact your seller.<br>
        <span id="text-subfooter">Time starts upon connection.</span>
      </p>
    </div>
  </div>

  <script type="module" src="src/app.js"></script>

  <script>
    let currentLang = 'en';
    function toggleLanguage() {
      const htmlRoot = document.getElementById('html-root');
      const langBtn = document.getElementById('lang-toggle-btn');
      if (currentLang === 'en') {
        currentLang = 'ar';
        htmlRoot.setAttribute('dir', 'rtl');
        htmlRoot.setAttribute('lang', 'ar');
        langBtn.textContent = 'عربي';
      } else {
        currentLang = 'en';
        htmlRoot.setAttribute('dir', 'ltr');
        htmlRoot.setAttribute('lang', 'en');
        langBtn.textContent = 'English';
      }
    }

    document.getElementById('paste-btn').addEventListener('click', async () => {
      try {
        const text = await navigator.clipboard.readText();
        if (text) {
          document.getElementById('access-key-input').value = text.trim();
        }
      } catch (err) {
        alert('Please allow clipboard permission');
      }
    });
  </script>
</body>
</html>
