<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIMHACK — Client Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #050505;
      color: #cacaca;
      font-family: 'JetBrains Mono', monospace, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    #login-container {
      width: 100%;
      max-width: 360px;
      padding: 24px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 20px;
    }
    .logo-img {
      max-width: 200px;
      width: 100%;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 0 15px rgba(229, 9, 20, 0.35));
    }
    input {
      width: 100%;
      background: #0a0a0a;
      border: 1px solid #1f1f1f;
      border-radius: 20px;
      padding: 14px 18px;
      color: #ffffff;
      font-size: 12px;
      text-align: center;
      outline: none;
      box-sizing: border-box;
      font-family: 'JetBrains Mono', monospace, sans-serif;
      letter-spacing: 1px;
    }
    input:focus {
      border-color: #e50914;
    }
    button#unlock-btn {
      width: 100%;
      background: #e50914;
      color: #ffffff;
      border: none;
      border-radius: 16px;
      padding: 16px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(229, 9, 20, 0.25);
    }
  </style>
</head>
<body>

  <div id="app">
    <!-- شاشة تسجيل الدخول الافتراضية مع الشعار الأصلي -->
    <div id="login-container">
      <img src="logo.png" alt="AIMHACK" class="logo-img" onerror="this.style.display='none'" />
      <div style="font-size: 14px; font-weight: 800; letter-spacing: 2px; color: #ffffff;">AIMHACK PORTAL</div>
      <input type="text" id="access-key-input" placeholder="ENTER ACCESS KEY" />
      <button id="unlock-btn">UNLOCK</button>
    </div>
  </div>

  <script type="module" src="/src/app.js"></script>
</body>
</html>
