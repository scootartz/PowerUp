<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POWER UP — Client Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #050505;
      color: #cacaca;
      font-family: 'JetBrains Mono', monospace, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      width: 100%;
      overflow-x: hidden;
    }
    #app {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    #login-container {
      width: 100%;
      max-width: 360px;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 20px;
    }
    .logo-img {
      max-width: 200px;
      width: 100%;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 0 15px rgba(229, 9, 20, 0.35));
    }
    input#access-key-input {
      width: 100%;
      background: #0a0a0a;
      border: 1px solid #1f1f1f;
      border-radius: 20px;
      padding: 14px 18px;
      color: #ffffff;
      font-size: 12px;
      font-weight: 700;
      text-align: center;
      outline: none;
      font-family: 'JetBrains Mono', monospace, sans-serif;
      letter-spacing: 1.5px;
      transition: border-color 0.2s;
    }
    input#access-key-input:focus {
      border-color: #e50914;
    }
    button#unlock-btn {
      width: 100%;
      background: #e50914;
      color: #ffffff;
      border: none;
      border-radius: 16px;
      padding: 16px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(229, 9, 20, 0.25);
      transition: opacity 0.2s;
    }
    button#unlock-btn:active {
      opacity: 0.85;
    }
  </style>
</head>
<body>

  <div id="app">
    <!-- واجهة تسجيل الدخول الشفافة التي تظهر قبل الشاشة الرئيسية -->
    <div id="login-container">
      <img src="logo.png" alt="POWER UP" class="logo-img" />
      <input type="text" id="access-key-input" placeholder="ENTER ACCESS KEY" maxlength="19" />
      <button id="unlock-btn">UNLOCK</button>
    </div>
  </div>

  <script type="module" src="/src/app.js"></script>
</body>
</html>
